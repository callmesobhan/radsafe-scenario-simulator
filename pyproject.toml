[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "radsafe"
dynamic = ["version"]
description = "RadSafe Scenario Simulator: radiation-protection exposure scenarios, shielding-model comparison and Monte Carlo uncertainty propagation."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["radiation protection", "health physics", "shielding", "monte carlo", "uncertainty"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest>=7.4", "ruff>=0.4", "matplotlib>=3.7"]

[project.scripts]
radsafe = "radsafe.cli:main"

[tool.setuptools.dynamic]
version = { attr = "radsafe.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
radsafe = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["radsafe", "conftest"]
